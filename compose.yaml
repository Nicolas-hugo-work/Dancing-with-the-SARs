name: sat-cochabamba

services:
  db:
    # postgis/postgis:17-3.7 fijado por digest
    image: postgis/postgis@sha256:a2e2834b016d98e1f7985b6b6f95071812628ccd23285200db3d2e3df513219d
    environment:
      POSTGRES_DB: "${POSTGRES_DB:?POSTGRES_DB no definido en .env}"
      POSTGRES_USER: "${POSTGRES_USER:?POSTGRES_USER no definido en .env}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:?POSTGRES_PASSWORD no definido en .env}"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      # $$: lo expande el shell del contenedor, no la interpolación de Compose.
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
      start_interval: 2s

  web:
    build: ./backend
    env_file:
      - path: ./.env
        required: true
    volumes:
      - ./backend:/app
    ports:
      - "127.0.0.1:8000:8000"

volumes:
  pgdata:
