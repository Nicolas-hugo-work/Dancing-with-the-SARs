name: sat-cochabamba

services:
  db:
    # postgis/postgis:17-3.7 fijado por digest
    image: postgis/postgis@sha256:a2e2834b016d98e1f7985b6b6f95071812628ccd23285200db3d2e3df513219d
    environment:
      POSTGRES_DB: "${POSTGRES_DB:?POSTGRES_DB no definido en .env}"
      POSTGRES_USER: "${POSTGRES_USER:?POSTGRES_USER no definido en .env}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:?POSTGRES_PASSWORD no definido en .env}"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      # $$: lo expande el shell del contenedor, no la interpolación de Compose.
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
      start_interval: 2s

  web:
    build: ./backend
    # sh -c con set -e: si migrate falla, runserver no arranca; exec deja a runserver como PID 1 para que reciba SIGTERM.
    command:
      - sh
      - "-c"
      - "set -e; python manage.py migrate; exec python manage.py runserver 0.0.0.0:8000"
    env_file:
      - path: ./.env
        required: true
    environment:
      # Prevalece sobre env_file; DJANGO_DEBUG=false en la orden sustituye al valor del .env.
      DJANGO_DEBUG: "${DJANGO_DEBUG:?DJANGO_DEBUG no definido en .env}"
    volumes:
      - ./backend:/app
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      # Cualquier excepción (conexión, timeout, HTTP 4xx/5xx) termina Python con código 1: no sano.
      test:
        - CMD
        - python
        - "-c"
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz/', timeout=4)"
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 60s
      start_interval: 2s

volumes:
  pgdata:
